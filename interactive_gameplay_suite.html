<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Aden Arena — Homologação de Gameplay Interativa Real</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #06080f; color: #d0d7de; padding: 20px; }
    h1 { color: #f0883e; font-size: 22px; border-bottom: 1px solid #21262d; padding-bottom: 8px; }
    h2 { color: #58a6ff; font-size: 16px; margin-top: 20px; }
    .scenario-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .scenario-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; padding-bottom: 8px; margin-bottom: 12px; }
    .scenario-title { font-weight: bold; color: #f0f6fc; font-size: 14px; }
    .scenario-badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-pass { background: #238636; color: #fff; }
    .badge-fail { background: #da3633; color: #fff; }
    .field-row { display: flex; font-size: 12px; margin: 4px 0; }
    .field-label { width: 220px; color: #8b949e; font-weight: bold; }
    .field-val { flex: 1; color: #c9d1d9; font-family: monospace; }
    .log-box { background: #161b22; border: 1px solid #30363d; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 11px; max-height: 140px; overflow-y: auto; margin-top: 8px; }
    #summary-panel { margin-top: 30px; padding: 16px; background: #161b22; border: 2px solid #30363d; border-radius: 8px; }
    #creation-ui-container { border: 1px solid #d4a744; padding: 15px; border-radius: 8px; background: #0b0e17; margin-bottom: 20px; }
    .ui-btn { padding: 6px 12px; margin: 4px; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; cursor: pointer; }
    .ui-btn.active { border-color: #f0883e; background: #3d2410; color: #ffd877; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Aden Arena: Homologação de Gameplay no Navegador Real (Edge Headless)</h1>
  <div id="status-line">Inicializando motores de produção...</div>

  <!-- Real Character Creation UI Form (exercised by Scenario 1) -->
  <div id="creation-ui-container">
    <h3 style="color:#ffd877; margin-top:0;">Interface Real de Criação de Personagem (UI)</h3>
    <form id="character-creation-form">
      <div>
        <label>Nome: </label>
        <input type="text" id="char-name-input" value="Tristan" maxlength="16" style="background:#161b22; color:#fff; border:1px solid #30363d; padding:4px 8px; border-radius:4px;" />
      </div>
      <div style="margin-top:8px;">
        <label>Gênero: </label>
        <button type="button" class="ui-btn active" id="gender-btn-M">♂️ Masculino</button>
        <button type="button" class="ui-btn" id="gender-btn-F">♀️ Feminino</button>
      </div>
      <div style="margin-top:8px;">
        <label>Raça: </label>
        <div id="race-buttons-bar"></div>
      </div>
      <div style="margin-top:8px;">
        <label>Classe: </label>
        <div id="class-buttons-bar"></div>
      </div>
      <div style="margin-top:12px;">
        <button type="submit" id="submit-create-hero" class="ui-btn" style="background:linear-gradient(180deg,#d4a744,#8a641c); color:#000; font-weight:bold; padding:8px 16px;">
          ✨ Criar Personagem & Entrar em Aden
        </button>
      </div>
    </form>
  </div>

  <!-- Game Host & Markup for Production Engine -->
  <div id="game-host" style="display:none;"></div>

  <div id="scenarios-container"></div>

  <div id="summary-panel">
    <h2>Relatório de Execução de Homologação Real</h2>
    <pre id="gameplay-report-json">Executando...</pre>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('status-line');
      if (el) el.textContent = 'GLOBAL ERROR: ' + e.message + ' in ' + e.filename + ':' + e.lineno;
      console.error('GLOBAL ERROR:', e);
    });
    window.addEventListener('unhandledrejection', (e) => {
      const el = document.getElementById('status-line');
      if (el) el.textContent = 'UNHANDLED REJECTION: ' + (e.reason?.message || e.reason);
      console.error('UNHANDLED REJECTION:', e);
    });
  </script>

  <script type="module">
    import '/lineage-idle/src/data/items/index.js';
    import '/lineage-idle/src/data/classes/index.js';
    import '/lineage-idle/data/echo-adapter.js';
    import '/lineage-idle/theme-grimoire.js';
    import { 
      init, 
      setRoot, 
      promoteClass, 
      switchSubclass, 
      renderSubclassesUI,
      attackMonster, 
      spendSP,
      equipItem,
      sellItem
    } from '/lineage-idle/main.js';
    import { getTotalXP } from '/lineage-idle/src/engine/LevelEngine.js';
    import { bootstrap } from '/lineage-idle/src/core/GameBootstrap.js';
    import { equipSkill, unequipSkill } from '/lineage-idle/src/services/SkillLoadoutService.js';
    import { promoteClass as servicePromoteClass, canAdvance } from '/lineage-idle/src/services/CharacterService.js';
    import { 
      isFeatureUnlocked, 
      getSeasonMaxLevel, 
      getCurrentSeasonId, 
      SEASONS_DATA 
    } from '/lineage-idle/src/core/SeasonConfig.js';
    import { CANONICAL_CLASS_REGISTRY } from '/lineage-idle/src/data/classes/CanonicalClassRegistry.js';
    import { CANONICAL_CLASS_REGISTRY_V2 } from '/lineage-idle/src/data/classes/CanonicalClassRegistryV2.js';
    import { CANONICAL_SKILL_REGISTRY_V2 } from '/lineage-idle/src/data/skills/CanonicalSkillRegistryV2.js';
    import { resolveCanonicalClassId } from '/lineage-idle/src/data/classes/class_aliases.js';
    import { combatEvents, CombatEventType } from '/lineage-idle/src/vfx/CombatEvent.js';
    import { IDLE_MARKUP } from '/src/idle/markup.ts';

    const consoleErrors = [];
    window.addEventListener('error', (e) => {
      consoleErrors.push({ message: e.message, filename: e.filename, lineno: e.lineno });
    });

    // Mount game host
    const gameHost = document.getElementById('game-host');
    gameHost.innerHTML = IDLE_MARKUP;
    setRoot(document);
    bootstrap(document);
    init();

    // Setup interactive character creation UI
    const raceBar = document.getElementById('race-buttons-bar');
    const classBar = document.getElementById('class-buttons-bar');
    const charNameInput = document.getElementById('char-name-input');
    const genderBtnM = document.getElementById('gender-btn-M');
    const genderBtnF = document.getElementById('gender-btn-F');
    const creationForm = document.getElementById('character-creation-form');

    let currentSelectedRace = 'human';
    let currentSelectedClass = 'fighter';
    let currentSelectedGender = 'M';

    genderBtnM.addEventListener('click', () => {
      currentSelectedGender = 'M';
      genderBtnM.classList.add('active');
      genderBtnF.classList.remove('active');
    });
    genderBtnF.addEventListener('click', () => {
      currentSelectedGender = 'F';
      genderBtnF.classList.add('active');
      genderBtnM.classList.remove('active');
    });

    // Canonical Races & Base Classes Data for UI
    const RACES_DATA = {
      human: ['fighter', 'mage', 'human_deathknight_0', 'werewolf_0', 'secret_assassin_male_0'],
      elf: ['elven_fighter', 'elven_mage', 'elf_deathknight_0'],
      darkelf: ['dark_fighter', 'dark_mage', 'delf_deathknight_0', 'secret_assassin_female_0', 'rose_vain_0'],
      orc: ['orc_fighter', 'orc_mage'],
      dwarf: ['dwarven_fighter', 'shineMakerBase'],
      kamael: ['kamael_m_soldier', 'kamael_f_soldier'],
      sylph: ['sylphid'],
      highelf: ['sacred_templar_0', 'spirit_0'],
      ertheia: ['marauderBase', 'sayhaMageBase']
    };

    function renderRaceButtons() {
      raceBar.innerHTML = '';
      Object.keys(RACES_DATA).forEach(r => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ui-btn' + (r === currentSelectedRace ? ' active' : '');
        btn.id = 'race-btn-' + r;
        btn.textContent = r.toUpperCase();
        btn.onclick = () => {
          currentSelectedRace = r;
          renderRaceButtons();
          renderClassButtons(r);
        };
        raceBar.appendChild(btn);
      });
    }

    function renderClassButtons(race) {
      classBar.innerHTML = '';
      const classes = RACES_DATA[race] || [];
      if (!classes.includes(currentSelectedClass)) {
        currentSelectedClass = classes[0];
      }
      classes.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ui-btn' + (c === currentSelectedClass ? ' active' : '');
        btn.id = 'class-btn-' + c;
        btn.textContent = c;
        btn.onclick = () => {
          currentSelectedClass = c;
          renderClassButtons(race);
        };
        classBar.appendChild(btn);
      });
    }

    renderRaceButtons();
    renderClassButtons('human');

    creationForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const payload = {
        charName: charNameInput.value.trim() || 'Tristan',
        race: currentSelectedRace,
        className: currentSelectedClass,
        gender: currentSelectedGender
      };
      if (typeof window.onCharacterCreated === 'function') {
        window.onCharacterCreated(payload);
      }
    });

    function getLiveState() {
      return (typeof window.getRawState === 'function') ? window.getRawState() : (window.getGameState ? window.getGameState() : null);
    }

    // Check execution pass (Pass 1 before reload vs Pass 2 after reload)
    const isPass2 = window.location.search.includes('pass=2') || sessionStorage.getItem('homologation_phase') === 'pass2';

    async function runHomologationSuite() {
      if (!isPass2) {
        await runPass1();
      } else {
        await runPass2();
      }
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // PASS 1: CENÁRIOS 1 A 7 + PREPARAÇÃO DO SAVE REAL (CENÁRIO 8) + RELOAD
    // ─────────────────────────────────────────────────────────────────────────────
    async function runPass1() {
      document.getElementById('status-line').textContent = 'Executando Fase 1: Cenários 1 a 7 e Preparação de Save...';
      const scenarioResults = [];

      // ─────────────────────────────────────────────────────────────
      // CENÁRIO 1: Criação Interativa via UI & Identidade Canônica Independente
      // Exercita formulário real, botões de raça/classe/gênero, submit e onCharacterCreated
      // Valida 12 classes (5 casos originais, Sylph, 5 CONTENT_GAP, Human Fighter)
      // ─────────────────────────────────────────────────────────────
      const creationCases = [
        { race: 'darkelf', classId: 'dark_fighter', canonicalId: 'dark_fighter', name: 'Kaelen', desc: 'Dark Fighter (Original)' },
        { race: 'darkelf', classId: 'dark_mage', canonicalId: 'dark_mage', name: 'Lilith', desc: 'Dark Mage (Original)' },
        { race: 'orc', classId: 'orc_mage', canonicalId: 'orc_mage', name: 'Gorguk', desc: 'Orc Mage (Original)' },
        { race: 'elf', classId: 'elven_fighter', canonicalId: 'elven_fighter', name: 'Faelar', desc: 'Elven Fighter (Original)' },
        { race: 'elf', classId: 'elven_mage', canonicalId: 'elven_mage', name: 'Aria', desc: 'Elven Mage (Original)' },
        { race: 'sylph', classId: 'sylphid', canonicalId: 'sylphid', name: 'Zephyr', desc: 'Sylphid (Sylph Gunner)' },
        { race: 'human', classId: 'fighter', canonicalId: 'human_fighter', name: 'Tristan', desc: 'Human Fighter (Referência)' },
        { race: 'human', classId: 'werewolf_0', canonicalId: 'werewolf_0', name: 'Fenrir', desc: 'Warg (CONTENT_GAP: V2_NODE_ABSENT)' },
        { race: 'dwarf', classId: 'shineMakerBase', canonicalId: 'shineMakerBase', name: 'Gilded', desc: 'Shine Maker (CONTENT_GAP: V2_NODE_ABSENT, 0 skills)' },
        { race: 'highelf', classId: 'spirit_0', canonicalId: 'spirit_0', name: 'Solas', desc: 'High Elf Spirit (CONTENT_GAP: V2_NODE_ABSENT)' },
        { race: 'ertheia', classId: 'marauderBase', canonicalId: 'marauderBase', name: 'Kael', desc: 'Marauder (CONTENT_GAP: UNPROVEN_PROVENANCE, 0 skills)' },
        { race: 'ertheia', classId: 'sayhaMageBase', canonicalId: 'sayhaMageBase', name: 'Sylphie', desc: 'Sayha Mage (CONTENT_GAP: UNPROVEN_PROVENANCE, 0 skills)' }
      ];

      const creationSubResults = [];
      for (const tc of creationCases) {
        // Interação via UI real do DOM
        charNameInput.value = tc.name;
        currentSelectedRace = tc.race;
        currentSelectedClass = tc.classId;
        renderRaceButtons();
        renderClassButtons(tc.race);

        const classBtn = document.getElementById('class-btn-' + tc.classId);
        if (classBtn) classBtn.click();

        creationForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));

        const st = getLiveState();
        const hasWeapon = Boolean(st && st.equipment && st.equipment.weapon);
        const hasArmor = Boolean(st && st.equipment && st.equipment.armor);
        const starterItemsCount = (st && Array.isArray(st.inventory)) ? st.inventory.length : 0;

        // Validação contra referência canônica independente
        const canonDef = CANONICAL_CLASS_REGISTRY[tc.canonicalId] || CANONICAL_CLASS_REGISTRY[tc.classId];
        const raceMatchesCanon = canonDef?.race === tc.race;
        const resolvedId = resolveCanonicalClassId(st?.class, st?.race);
        const classMatchesCanon = (st?.class === tc.classId) || (resolvedId === tc.canonicalId);

        const passed = raceMatchesCanon && classMatchesCanon && hasWeapon && hasArmor && starterItemsCount >= 4;
        creationSubResults.push({
          caseId: `${tc.race}_${tc.classId}`,
          desc: tc.desc,
          canonicalRace: canonDef?.race,
          actualRace: st?.race,
          raceMatchesCanon,
          classMatchesCanon,
          hasWeapon,
          hasArmor,
          starterItemsCount,
          weaponItem: st?.equipment?.weapon ? st.inventory.find(i => i.uid === st.equipment.weapon)?.itemId : 'none',
          starterSkill: st?.selectedSkill || 'none',
          skillsCount: Object.keys(st?.skills || {}).length,
          passed
        });
      }

      const allCreationPassed = creationSubResults.every(r => r.passed);
      scenarioResults.push({
        scenarioId: 'SCENARIO_1_INTERACTIVE_CREATION',
        title: 'Criação de Personagem via Controles Reais da UI & Validação de Identidade Independente',
        type: 'UI_INTERACTION',
        status: allCreationPassed ? 'PASS' : 'FAIL',
        initialState: 'Formulário de criação no DOM com inputs de texto, seletores de gênero, raça e classe',
        actions: 'Simulação interativa de seleção de 12 classes (5 originais, sylphid, human_fighter e 5 CONTENT_GAP) e submit form',
        expected: 'window.onCharacterCreated dispara applyStarterKit; raça e classe conferem com CANONICAL_CLASS_REGISTRY; 4 itens No-Grade e arma equipada',
        observed: `12/12 classes criadas via UI (${creationSubResults.map(r => `${r.caseId} [Raça:${r.actualRace}]`).join(', ')})`,
        details: creationSubResults,
        consoleErrorsCount: consoleErrors.length
      });

      // ─────────────────────────────────────────────────────────────
      // CENÁRIO 2: Aprendizado Real com Débito de SP via Motor de Produção (spendSP)
      // ─────────────────────────────────────────────────────────────
      charNameInput.value = 'SirLancelot';
      currentSelectedRace = 'human';
      currentSelectedClass = 'fighter';
      renderRaceButtons();
      renderClassButtons('human');
      creationForm.dispatchEvent(new Event('submit'));

      const st2 = getLiveState();
      delete st2.skills['power_strike'];
      st2.sp = 500;
      st2.level = 5;
      const spBefore = st2.sp;

      // Executa aprendizado real via spendSP
      const learnRes = window.spendSP('power_strike');
      const spAfter = st2.sp;
      const skillLearned = st2.skills['power_strike'] === 1;
      const spDeducted = spBefore > spAfter;

      // Tentativa de aprender sem SP suficiente
      st2.sp = 0;
      const learnFailRes = window.spendSP('power_strike');
      const spUnaffected = st2.sp === 0;

      const learningPassed = learnRes && skillLearned && spDeducted && (!learnFailRes) && spUnaffected;
      scenarioResults.push({
        scenarioId: 'SCENARIO_2_PRODUCTION_SKILL_LEARNING',
        title: 'Aprendizado com Débito de SP via Motor de Produção (spendSP)',
        type: 'DIRECT_SERVICE_CALL',
        status: learningPassed ? 'PASS' : 'FAIL',
        initialState: `Human Fighter Lv 5 com ${spBefore} SP, power_strike nv 0`,
        actions: 'Chamada a window.spendSP("power_strike") com 500 SP, seguido de tentativa com 0 SP',
        expected: 'SP debitado pelo custo exato da habilidade, nível incrementado em state.skills, rejeição segura sem SP',
        observed: `SP inicial: ${spBefore} -> SP final: ${spAfter} (debitado: ${spBefore - spAfter}). Rejeição com 0 SP: OK. Habilidade nível: ${st2.skills['power_strike']}`,
        consoleErrorsCount: consoleErrors.length
      });

      // ─────────────────────────────────────────────────────────────
      // CENÁRIO 3: Equipamento no Loadout com Validação de Slot Desbloqueado, Bloqueio de Passivas e Habilidades Estrangeiras
      // Testa em slots existentes e desbloqueados (Lv 40), garantindo que a rejeição ocorra pela regra sob teste
      // ─────────────────────────────────────────────────────────────
      const st3 = getLiveState();
      st3.level = 40; // Garante que slots basic, core1, core2, special1, special2, signature estejam desbloqueados
      st3.class = 'fighter';
      st3.skills['power_strike'] = 1;     // Ativa válida
      st3.skills['weapon_mastery'] = 1;   // Passiva
      st3.skills['hydro_blast'] = 1;      // Estrangeira (Mage)

      // 1. Equipamento válido de habilidade ativa em slot desbloqueado (core1)
      const equipActiveRes = equipSkill(st3, 'core1', 'power_strike', CANONICAL_SKILL_REGISTRY_V2);
      const activeEquipped = equipActiveRes.success === true && st3.skillLoadout?.core1 === 'power_strike';

      // 2. Rejeição de habilidade passiva em slot desbloqueado (core2) — deve rejeitar pela regra de passiva
      const equipPassiveRes = equipSkill(st3, 'core2', 'weapon_mastery', CANONICAL_SKILL_REGISTRY_V2);
      const passiveRejectedByRule = equipPassiveRes.success === false 
        && String(equipPassiveRes.error || '').toLowerCase().includes('passive')
        && st3.skillLoadout?.core2 !== 'weapon_mastery';

      // 3. Rejeição de habilidade estrangeira em slot desbloqueado (core2) — deve rejeitar por progressão de classe
      const equipForeignRes = equipSkill(st3, 'core2', 'hydro_blast');
      const foreignRejectedByRule = equipForeignRes.success === false 
        && String(equipForeignRes.error || '').toLowerCase().includes('progression path')
        && st3.skillLoadout?.core2 !== 'hydro_blast';

      const loadoutPassed = activeEquipped && passiveRejectedByRule && foreignRejectedByRule;
      scenarioResults.push({
        scenarioId: 'SCENARIO_3_PRODUCTION_LOADOUT_EQUIP',
        title: 'Equipamento de Habilidades no Loadout com Validação de Slot Desbloqueado e Bloqueio Específico de Passiva e Estrangeira',
        type: 'DIRECT_SERVICE_CALL',
        status: loadoutPassed ? 'PASS' : 'FAIL',
        initialState: 'Human Fighter Lv 40 (slots core1 e core2 desbloqueados), power_strike (ativa), weapon_mastery (passiva) e hydro_blast (estrangeira) aprendidas',
        actions: 'equipSkill("core1", "power_strike"), equipSkill("core2", "weapon_mastery"), equipSkill("core2", "hydro_blast")',
        expected: 'power_strike equipada; weapon_mastery rejeitada especificamente por ser passiva; hydro_blast rejeitada por não pertencer à progressão da classe',
        observed: `Ativa equipada: ${activeEquipped}. Passiva bloqueada por regra: ${passiveRejectedByRule} (msg: "${equipPassiveRes.error}"). Estrangeira bloqueada por regra: ${foreignRejectedByRule} (msg: "${equipForeignRes.error}")`,
        consoleErrorsCount: consoleErrors.length
      });

      // ─────────────────────────────────────────────────────────────
      // CENÁRIO 4: Combate Real de Produção & Auto-Ataque CONTENT_GAP (attackMonster)
      // Executa o ciclo de produção attackMonster() para todas as 5 classes CONTENT_GAP com monstro completo (xp, elite, gold)
      // ─────────────────────────────────────────────────────────────
      const combatGapClasses = [
        { classId: 'shineMakerBase', race: 'dwarf', weapon: 'weapon_dwarven_mace', name: 'Shine Maker (0 skills)', hasSkills: false },
        { classId: 'marauderBase', race: 'ertheia', weapon: 'weapon_knuckle_duster', name: 'Marauder (0 skills)', hasSkills: false },
        { classId: 'sayhaMageBase', race: 'ertheia', weapon: 'weapon_apprentice_staff', name: 'Sayha Mage (0 skills)', hasSkills: false },
        { classId: 'werewolf_0', race: 'human', weapon: 'weapon_broad_sword', name: 'Warg (1 skill: direct_strike)', hasSkills: true, skillId: 'direct_strike' },
        { classId: 'spirit_0', race: 'highelf', weapon: 'weapon_apprentice_staff', name: 'High Elf Spirit (2 skills: fire_sphere)', hasSkills: true, skillId: 'fire_sphere' }
      ];

      const combatResults = [];
      for (const c of combatGapClasses) {
        charNameInput.value = 'CombatHero';
        currentSelectedRace = c.race;
        currentSelectedClass = c.classId;
        renderRaceButtons();
        renderClassButtons(c.race);
        creationForm.dispatchEvent(new Event('submit'));

        const cst = getLiveState();
        cst.xp = 0;
        cst.sp = 0;
        cst.level = 1;
        cst.stats = { monstersKilled: 0 };
        cst.isCombatActive = true;
        cst.zone = 'talkingIsland';

        // Configura monstro alvo completo com xp, elite e gold
        const monster = {
          id: 'gremlin_test',
          name: 'Gremlin de Treino (Elite)',
          hp: 80,
          maxHp: 80,
          pdef: 5,
          mdef: 5,
          xp: 50,
          elite: true,
          gold: [15, 30],
          level: 1
        };
        cst.target = 'gremlin_test';
        cst.activeMonster = monster;

        if (c.hasSkills && c.skillId) {
          cst.skills[c.skillId] = 1;
          equipSkill(cst, 'core1', c.skillId, CANONICAL_SKILL_REGISTRY_V2);
        }

        const hpInitial = monster.hp;
        const xpInitial = cst.xp || 0;
        const spInitial = cst.sp || 0;
        const levelInitial = cst.level || 1;
        const killsInitial = cst.stats?.monstersKilled || 0;

        let killEventFired = false;
        let killEventData = null;
        const onSkillKill = (ev) => {
          killEventFired = true;
          killEventData = ev;
        };
        combatEvents.on(CombatEventType.SKILL_KILL, onSkillKill);

        let ticks = 0;
        let errorsCaught = 0;
        while (monster.hp > 0 && ticks < 25) {
          try {
            window.attackMonster();
          } catch (err) {
            errorsCaught++;
            consoleErrors.push({ message: `Combat crash on ${c.classId}: ${err.message}` });
            break;
          }
          ticks++;
        }

        combatEvents.off(CombatEventType.SKILL_KILL, onSkillKill);

        const damageDealt = hpInitial - monster.hp;
        const monsterDefeated = monster.hp <= 0;
        const xpAfter = cst.xp || 0;
        const spAfter = cst.sp || 0;
        const levelAfter = cst.level || 1;
        const killsAfter = cst.stats?.monstersKilled || 0;

        // Validação estrita de Crédito Efetivo no Estado:
        const deltaXP = xpAfter - xpInitial;
        const deltaSP = spAfter - spInitial;
        const deltaKills = killsAfter - killsInitial;

        // 1. Validação de XP considerando subida de nível (LevelEngine usa XP cumulativo)
        const leveledUp = levelAfter > levelInitial;
        const xpThresholdValid = leveledUp ? (xpAfter >= getTotalXP(levelInitial)) : true;
        const xpGainedInState = deltaXP > 0 && deltaXP >= monster.xp && xpThresholdValid;

        browser: navigator.userAgent,
        totalScenarios: scenarioResults.length,
        passedScenarios: scenarioResults.filter(s => s.status === 'PASS').length,
        failedScenarios: scenarioResults.filter(s => s.status !== 'PASS').length,
        totalConsoleErrors: consoleErrors.length,
        consoleErrors,
        scenarios: scenarioResults
      };

      document.getElementById('gameplay-report-json').textContent = JSON.stringify(report, null, 2);
      document.getElementById('status-line').textContent = `HOMOLOGAÇÃO CONCLUÍDA: ${report.passedScenarios}/${report.totalScenarios} APROVADOS (${report.totalConsoleErrors} erros de console)`;
      document.title = 'HOMOLOGATION_COMPLETE_' + report.passedScenarios + '_OF_' + report.totalScenarios;
    }

    try {
      await runHomologationSuite();
    } catch (err) {
      document.getElementById('status-line').textContent = 'FATAL ERROR IN SUITE: ' + err.message;
      document.getElementById('gameplay-report-json').textContent = JSON.stringify({
        error: err.message,
        stack: err.stack,
        consoleErrors
      }, null, 2);
    }
  </script>
</body>
</html>
