<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lineage Idle / Aden Arena — Protótipo 2D Combate Multi-Classe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08060b;
      --panel-bg: rgba(18, 14, 25, 0.92);
      --panel-border: rgba(205, 164, 52, 0.35);
      --gold-primary: #f6cf68;
      --gold-accent: #cda434;
      --gold-dark: #7a5c17;
      --hp-color: #e53935;
      --mp-color: #1e88e5;
      --stagger-color: #fb8c00;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 12px;
      background: radial-gradient(circle at center, #1b1226 0%, #08060b 80%);
    }

    .arena-container {
      position: relative;
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      background: #0d0a14;
      border: 2px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(205, 164, 52, 0.15);
      overflow: hidden;
    }

    /* Top HUD */
    .arena-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: linear-gradient(180deg, rgba(28, 20, 38, 0.95) 0%, rgba(14, 10, 20, 0.85) 100%);
      border-bottom: 1px solid var(--panel-border);
      position: relative;
      z-index: 10;
    }

    .actor-hud {
      display: flex;
      flex-direction: column;
      width: 330px;
      gap: 6px;
    }

    .actor-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .actor-name {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--gold-primary);
      text-shadow: 0 0 8px rgba(246, 207, 104, 0.4);
    }

    .actor-class {
      font-size: 12px;
      color: var(--text-muted);
    }

    .bar-container {
      position: relative;
      width: 100%;
      height: 14px;
      background: #181420;
      border: 1px solid #332845;
      border-radius: 7px;
      overflow: hidden;
    }

    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #991b1b 0%, #ef4444 100%);
      transition: width 0.25s ease-out;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
    }

    .stagger-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d97706 0%, #f59e0b 100%);
      transition: width 0.25s ease-out;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    .bar-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    .state-badge {
      display: inline-block;
      align-self: flex-start;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
    }

    .state-idle { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #4ade80; }
    .state-attacking { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #f87171; }
    .state-casting { background: rgba(168, 85, 247, 0.2); border-color: #a855f7; color: #c084fc; }
    .state-hit { background: rgba(234, 179, 8, 0.2); border-color: #eab308; color: #fde047; }
    .state-dead { background: rgba(100, 116, 139, 0.3); border-color: #64748b; color: #cbd5e1; }

    /* Center Stage Info */
    .stage-center-hud {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stage-title {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 1px;
      color: #f8fafc;
      text-transform: uppercase;
    }

    .stage-zone {
      font-size: 12px;
      color: var(--gold-accent);
    }

    .fps-badge {
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.7);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #0284c7;
    }

    /* Canvas Viewport */
    .viewport-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    #combat-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }

    /* Action Bar (Populated dynamically) */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 14px;
      background: linear-gradient(0deg, rgba(28, 20, 38, 0.98) 0%, rgba(14, 10, 20, 0.85) 100%);
      border-top: 1px solid var(--panel-border);
      flex-wrap: wrap;
      min-height: 82px;
    }

    .skill-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      min-width: 150px;
      background: linear-gradient(180deg, #251c33 0%, #171121 100%);
      border: 1px solid var(--gold-dark);
      border-radius: 8px;
      color: #f1f5f9;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      gap: 3px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .skill-btn:hover {
      border-color: var(--gold-primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(246, 207, 104, 0.25);
      background: linear-gradient(180deg, #322547 0%, #1d152a 100%);
    }

    .skill-btn:active {
      transform: translateY(1px);
    }

    .skill-btn .btn-icon {
      font-size: 20px;
    }

    .skill-btn .btn-sub {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      color: var(--gold-accent);
      font-weight: 400;
    }

    .skill-btn.ultimate {
      border-color: #f59e0b;
      background: linear-gradient(180deg, #451a03 0%, #1f0b01 100%);
    }

    .skill-btn.ultimate:hover {
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
      border-color: #fbbf24;
    }

    /* Sandbox / Debug Controls Panel */
    .debug-drawer {
      background: #090610;
      border-top: 1px solid rgba(205, 164, 52, 0.2);
      padding: 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 12px;
    }

    .drawer-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .debug-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .debug-label {
      color: var(--gold-accent);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .debug-btn {
      padding: 6px 12px;
      background: #1e172a;
      border: 1px solid #3d2f52;
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .debug-btn:hover {
      background: #2d2240;
      color: #fff;
      border-color: var(--gold-accent);
    }

    .debug-btn.active {
      background: var(--gold-accent);
      color: #000;
      border-color: var(--gold-primary);
      box-shadow: 0 0 10px rgba(205, 164, 52, 0.4);
    }

    .select-dropdown {
      padding: 6px 10px;
      background: #1e172a;
      border: 1px solid var(--gold-dark);
      border-radius: 6px;
      color: var(--gold-primary);
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      outline: none;
    }

    .select-dropdown:focus {
      border-color: var(--gold-primary);
    }

    .hotkey-hints {
      font-size: 11px;
      color: #64748b;
      display: flex;
      gap: 12px;
    }

    .hotkey-hints kbd {
      background: #1e293b;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid #334155;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="arena-container">
    <!-- Top HUD Bar -->
    <header class="arena-hud">
      <!-- Hero Stats -->
      <div class="actor-hud" id="hero-hud">
        <div class="actor-header">
          <span class="actor-name" id="hero-name">Human Sorcerer</span>
          <span class="actor-class" id="hero-class">Lv. 76 · MAGE</span>
        </div>
        <div class="bar-container">
          <div class="hp-bar-fill" id="hero-hp-bar"></div>
          <span class="bar-label" id="hero-hp-text">3600 / 3600</span>
        </div>
        <span class="state-badge state-idle" id="hero-state-badge">IDLE</span>
      </div>

      <!-- Center Status & Stage -->
      <div class="stage-center-hud">
        <span class="stage-title">Aden Arena — Combate 2D Animado</span>
        <span class="stage-zone" id="stage-zone">Forge of the Gods</span>
        <span class="fps-badge" id="fps-counter">60 FPS</span>
      </div>

      <!-- Monster Stats -->
      <div class="actor-hud" id="monster-hud">
        <div class="actor-header">
          <span class="actor-name" id="monster-name">Shadow Wraith</span>
          <span class="actor-class" id="monster-class">Lv. 78 · MONSTER</span>
        </div>
        <div class="bar-container">
          <div class="hp-bar-fill" id="monster-hp-bar"></div>
          <span class="bar-label" id="monster-hp-text">5500 / 5500</span>
        </div>
        <div class="bar-container" style="height: 6px; margin-top: 2px;">
          <div class="stagger-bar-fill" id="monster-stagger-bar"></div>
        </div>
        <span class="state-badge state-idle" id="monster-state-badge">IDLE</span>
      </div>
    </header>

    <!-- Canvas Viewport -->
    <main class="viewport-wrapper">
      <canvas id="combat-canvas" width="1280" height="720"></canvas>
    </main>

    <!-- Dynamic Combat Action Bar -->
    <nav class="action-bar" id="action-bar" aria-label="Ações de Combate Dinâmicas">
      <!-- Inserido dinamicamente via main.js renderActionBar() -->
    </nav>

    <!-- Debug & Sandbox Drawer -->
    <footer class="debug-drawer">
      <!-- Row 1: Selectors -->
      <div class="drawer-row">
        <div class="debug-group">
          <span class="debug-label">🧙‍♂️ Herói / Classe:</span>
          <select id="select-class" class="select-dropdown">
            <option value="human_sorcerer" selected>Human Sorcerer (Mage de Fogo)</option>
            <option value="paladin">Paladin (Phoenix Knight - Tanque Sagrado)</option>
            <option value="assassin">Ghost Hunter (Assassin - Dagger Crítico)</option>
            <option value="spellsinger">Spellsinger (Storm Archmage - Relâmpago)</option>
            <option value="death_knight">Death Knight (Vampiric Lord - Drenagem)</option>
          </select>
        </div>

        <div class="debug-group">
          <span class="debug-label">👹 Inimigo / Chefe:</span>
          <select id="select-monster" class="select-dropdown">
            <option value="shadow_wraith" selected>Shadow Wraith (Morto-Vivo)</option>
            <option value="corrupted_knight">Corrupted Knight (Boss das Trevas)</option>
            <option value="arch_necromancer">Arch Necromancer (Lich Lord)</option>
          </select>
        </div>

        <div class="debug-group">
          <span class="debug-label">🗺️ Campo de Batalha:</span>
          <select id="select-map" class="select-dropdown">
            <option value="forgeofgods" selected>Forge of the Gods (Vulcão)</option>
            <option value="dragonvalley">Dragon Valley (Desfiladeiro)</option>
            <option value="antharaslair">Antharas' Lair (Covil do Dragão)</option>
            <option value="valleyofsaints">Valley of Saints (Santuário)</option>
            <option value="baium">Tower of Insolence (Baium)</option>
          </select>
        </div>
      </div>

      <!-- Row 2: Controls & Hotkeys -->
      <div class="drawer-row">
        <div class="debug-group">
          <span class="debug-label">Ações:</span>
          <button class="debug-btn" id="btn-idle">Idle</button>
          <button class="debug-btn" id="btn-monster-atk">Inimigo Ataca</button>
          <button class="debug-btn" id="btn-kill">Kill (99999)</button>
          <button class="debug-btn" id="btn-reset">Reset</button>
        </div>

        <div class="debug-group">
          <button class="debug-btn" id="btn-toggle-static">🎭 Modo: Imagem Estática (Card)</button>
          <button class="debug-btn" id="btn-toggle-anchors">🎯 Âncoras Espaciais</button>
          <button class="debug-btn" id="btn-auto-loop">▶ Iniciar Auto-Combate</button>
        </div>

        <div class="hotkey-hints">
          <span><kbd>1-4</kbd> Habilidades</span>
          <span><kbd>C</kbd> Comparação A/B</span>
          <span><kbd>Espaço</kbd> Auto-combate</span>
          <span><kbd>R</kbd> Reset</span>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
