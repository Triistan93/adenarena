name: CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test, Security Rules & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Security & Production Guard Tests
        run: node --test test/production-security.test.js test/cakto-webhook-security.test.js

      - name: Unit & System Integrity Tests
        run: |
          node --test \
            test/equipment-balance-validation.test.js \
            test/inventory-hero-pillar-validation.test.js \
            test/hero-pillar-feature-coverage.test.js \
            test/olympiad-glory-pillar-validation.test.js \
            test/sevensigns-glory-pillar-validation.test.js \
            test/canonical-firestore-player-identity.test.js

      - name: Production Vite Build
        run: npm run build
